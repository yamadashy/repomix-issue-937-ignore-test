name: Test Repomix .ignore Support

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  test-ignore-file:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install repomix 1.9.0
        run: npm install -g repomix@1.9.0

      - name: Show directory structure
        run: |
          echo "=== Directory Structure ==="
          find . -type f -name "*.json" -o -name ".ignore"

      - name: Show .ignore file content
        run: |
          echo "=== .ignore file content ==="
          cat .ignore

      - name: Run repomix
        run: |
          echo "=== Running repomix ==="
          repomix --output repomix-output.txt

      - name: Show repomix output
        run: |
          echo "=== Repomix Output (first 100 lines) ==="
          head -n 100 repomix-output.txt || true

      - name: Check if spec/data/ files are included (should be excluded)
        run: |
          echo "=== Checking if spec/data/openaip/de_apt.json is in output ==="
          if grep -q "de_apt.json" repomix-output.txt; then
            echo "❌ ISSUE REPRODUCED: spec/data/openaip/de_apt.json is included in output despite being in .ignore"
            echo "The .ignore file should exclude spec/data/ but it doesn't work!"
            grep -n "de_apt.json" repomix-output.txt || true
            exit 1
          else
            echo "✅ OK: spec/data/openaip/de_apt.json is correctly excluded"
            exit 0
          fi

      - name: Upload repomix output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repomix-output
          path: repomix-output.txt
